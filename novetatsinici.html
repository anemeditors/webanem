<style>
  .anem-grid-2 {
    display: flex !important;
    flex-wrap: wrap !important;
    justify-content: space-between !important;
    margin-top: 40px !important;
    width: 100% !important;
    box-sizing: border-box !important;
  }
  .anem-grid-4 {
    display: flex !important;
    flex-wrap: wrap !important;
    justify-content: flex-start !important;
    margin-top: 40px !important;
    width: 100% !important;
    box-sizing: border-box !important;
  }
  .anem-card-destacada {
    width: 47% !important;
    text-align: center !important;
    box-sizing: border-box !important;
    margin-bottom: 50px !important;
    position: relative !important;
  }
  .anem-wrapper-coberta {
    position: relative !important;
    display: inline-block !important;
    margin-bottom: 15px !important;
  }
  .anem-badge {
    position: absolute !important;
    top: -10px !important;
    left: -10px !important;
    color: white !important;
    font-size: 0.75em !important;
    padding: 4px 8px !important;
    font-weight: bold !important;
    border-radius: 3px !important;
    text-transform: uppercase !important;
    z-index: 10 !important;
    box-shadow: 0 2px 5px rgba(0,0,0,0.2) !important;
  }
  .anem-badge-novetat { background-color: crimson !important; }
  .anem-badge-destacat { background-color: #2e7d32 !important; }

  .anem-card-destacada img {
    width: 100% !important;
    height: auto !important;
    max-width: 280px !important;
    display: block !important;
    margin: 0 auto !important;
    filter: drop-shadow(0px 8px 12px rgba(0,0,0,0.25)) !important;
    mix-blend-mode: multiply !important;
  }
  .anem-card-general {
    width: 23.5% !important;
    text-align: center !important;
    margin-bottom: 40px !important;
    box-sizing: border-box !important;
    padding: 0 5px !important;
  }
  .anem-card-general img {
    width: 100% !important;
    height: auto !important;
    max-width: 140px !important;
    display: block !important;
    margin: 0 auto 10px auto !important;
    filter: drop-shadow(0px 4px 6px rgba(0,0,0,0.22)) !important;
    mix-blend-mode: multiply !important;
  }
  .anem-titol {
    display: block !important;
    font-weight: bold !important;
    color: #c00 !important;
    text-decoration: none !important;
    margin: 0 0 4px 0 !important;
    font-size: 1.1em !important;
    line-height: 1.2 !important;
  }
  .anem-autor {
    font-size: 0.9em !important;
    color: #555 !important;
    margin-bottom: 4px !important;
  }
  .anem-preu {
    font-size: 1em !important;
    font-weight: bold !important;
    color: #333 !important;
    margin-bottom: 10px !important;
  }
  .anem-botons {
    display: flex !important;
    justify-content: center !important;
    gap: 6px !important;
    flex-wrap: wrap !important;
    margin-top: 6px !important;
  }
  .anem-btn {
    display: inline-block !important;
    padding: 4px 8px !important;
    font-size: 0.7em !important;
    font-weight: bold !important;
    text-decoration: none !important;
    border-radius: 3px !important;
    color: #fff !important;
  }
  .anem-btn-ttl { background-color: #2b2b2b !important; }
  .anem-btn-amz { background-color: #e47911 !important; }

  @media screen and (max-width: 768px) {
    .anem-card-destacada { width: 100% !important; }
    .anem-card-general { width: 47% !important; }
  }
</style>

<div id="seccio-novetats" class="anem-grid-2"></div>
<div id="seccio-destacats" class="anem-grid-2"></div>
<div id="seccio-general" class="anem-grid-4"></div>

<script>
(function() {
  var CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQESjqxo632pyAya7JVHONT0tCGm6XSLnHE1ft4dwY7uIRCUKSiXac8tOj1hYVEkmW-1E7KkPgYv-DR/pub?output=csv';

  function parseCSV(text) {
    var p = '', c = '', r = [];
    var q = false;
    var row = [''];
    for (var i = 0; i < text.length; i++) {
      c = text[i];
      var next = text[i+1];
      if (c === '"') {
        if (q && next === '"') { row[row.length - 1] += '"'; i++; }
        else { q = !q; }
      } else if (c === ',' && !q) {
        row.push('');
      } else if ((c === '\r' || c === '\n') && !q) {
        if (c === '\r' && next === '\n') { i++; }
        r.push(row);
        row = [''];
      } else {
        row[row.length - 1] += c;
      }
    }
    if (row.length > 1 || row[0] !== '') r.push(row);
    return r;
  }

  function norm(str) {
    return (str || '').normalize("NFD").replace(/[\u0300-\u036f]/g, "").trim().toLowerCase();
  }

  function trobarIndex(headers, possibles) {
    return headers.findIndex(function(h) { return possibles.includes(norm(h)); });
  }

  function generarBotons(ttl, amz) {
    if (!ttl && !amz) return '';
    var h = '<div class="anem-botons">';
    if (ttl) h += '<a class="anem-btn anem-btn-ttl" href="' + ttl + '" target="_blank" rel="noopener">Todostuslibros</a>';
    if (amz) h += '<a class="anem-btn anem-btn-amz" href="' + amz + '" target="_blank" rel="noopener">Amazon</a>';
    h += '</div>';
    return h;
  }

  async function carregarDades() {
    var secNovetats = document.getElementById('seccio-novetats');
    var secDestacats = document.getElementById('seccio-destacats');
    var secGeneral = document.getElementById('seccio-general');

    try {
      var res = await fetch(CSV_URL);
      var text = await res.text();
      var rows = parseCSV(text);

      if (rows.length < 2) return;

      var headers = rows[0];

      var idxTitol = trobarIndex(headers, ['titol', 'titulo', 'title']);
      var idxAutor = trobarIndex(headers, ['autor', 'author']);
      var idxPreu = trobarIndex(headers, ['pvp', 'preu', 'precio', 'price']);
      var idxInici = trobarIndex(headers, ['inici web', 'inici', 'inicio web', 'inicio', 'estat']);
      var idxImg = trobarIndex(headers, ['coberta', 'url coberta', 'portada', 'url portada', 'imatge', 'imagen']);
      var idxLink = trobarIndex(headers, ['url llibre', 'url fitxa', 'url', 'enllac', 'link']);
      var idxTTL = trobarIndex(headers, ['todostuslibros', 'todos tus libros', 'ttl']);
      var idxAmz = trobarIndex(headers, ['amazon', 'amz']);

      var hNovetats = '', hDestacats = '', hGeneral = '';

      for (var i = 1; i < rows.length; i++) {
        var row = rows[i];
        var titol = idxTitol !== -1 && row[idxTitol] ? row[idxTitol].trim() : '';
        var estat = idxInici !== -1 && row[idxInici] ? row[idxInici].trim() : '';

        if (!titol) continue;

        var autor = idxAutor !== -1 && row[idxAutor] ? row[idxAutor].trim() : '';
        var preuRaw = idxPreu !== -1 && row[idxPreu] ? row[idxPreu].trim() : '';
        var img = idxImg !== -1 && row[idxImg] ? row[idxImg].trim() : '';
        var link = idxLink !== -1 && row[idxLink] ? row[idxLink].trim() : '#';
        var urlTTL = idxTTL !== -1 && row[idxTTL] ? row[idxTTL].trim() : '';
        var urlAmz = idxAmz !== -1 && row[idxAmz] ? row[idxAmz].trim() : '';

        var preu = preuRaw && !preuRaw.includes('€') ? preuRaw + ' €' : preuRaw;
        var botons = generarBotons(urlTTL, urlAmz);
        var estatNorm = norm(estat);

        if (estatNorm.includes('novetat')) {
          hNovetats += '<div class="anem-card-destacada">' +
            '<div class="anem-wrapper-coberta">' +
              '<span class="anem-badge anem-badge-novetat">NOVETAT</span>' +
              '<a href="' + link + '"><img src="' + img + '" alt="' + titol + '"></a>' +
            '</div>' +
            '<a class="anem-titol" href="' + link + '"><b>' + titol.toUpperCase() + '</b></a>' +
            '<div class="anem-autor">' + autor + '</div>' +
            '<div class="anem-preu">' + preu + '</div>' +
            botons +
          '</div>';
        } else if (estatNorm.includes('destacat')) {
          hDestacats += '<div class="anem-card-destacada">' +
            '<div class="anem-wrapper-coberta">' +
              '<span class="anem-badge anem-badge-destacat">DESTACAT</span>' +
              '<a href="' + link + '"><img src="' + img + '" alt="' + titol + '"></a>' +
            '</div>' +
            '<a class="anem-titol" href="' + link + '"><b>' + titol.toUpperCase() + '</b></a>' +
            '<div class="anem-autor">' + autor + '</div>' +
            '<div class="anem-preu">' + preu + '</div>' +
            botons +
          '</div>';
        } else if (estatNorm.includes('general') || (estatNorm !== '' && !estatNorm.includes('no'))) {
          hGeneral += '<div class="anem-card-general">' +
            '<a href="' + link + '"><img src="' + img + '" alt="' + titol + '"></a>' +
            '<a class="anem-titol" href="' + link + '">' + titol.toUpperCase() + '</a>' +
            '<div class="anem-autor">' + autor + '</div>' +
            '<div class="anem-preu">' + preu + '</div>' +
            botons +
          '</div>';
        }
      }

      if (secNovetats) secNovetats.innerHTML = hNovetats;
      if (secDestacats) secDestacats.innerHTML = hDestacats;
      if (secGeneral) secGeneral.innerHTML = hGeneral;

    } catch (e) {
      console.error(e);
    }
  }

  carregarDades();
})();
</script>
