  .anem-botons-box {

  @media screen and (max-width: 768px) {

    .anem-grid-2-col { display: block !important; width: 100% !important; margin-top: 20px !important; }
    .anem-card-gran { width: 100% !important; max-width: 100% !important; margin-bottom: 40px !important; display: block !important; }
    .anem-card-gran img { max-width: 240px !important; }
    .anem-grid-4-col { display: grid !important; grid-template-columns: repeat(2, 1fr) !important; gap: 15px !important; width: 100% !important; margin-top: 20px !important; }
    .anem-etiqueta {
      position: relative !important;
      top: auto !important;
      right: auto !important;
      margin: 0 auto 10px auto !important;

<div class="anem-wrapper-total">
  <div id="seccio-novetats" class="anem-grid-2-col"></div>
  <div id="seccio-destacats" class="anem-grid-2-col"></div>
  <div id="seccio-general" class="anem-grid-4-col"></div>
</div>

<script>
(function() {
  var CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQESjqxo632pyAya7JVHONT0tCGm6XSLnHE1ft4dwY7uIRCUKSiXac8tOj1hYVEkmW-1E7KkPgYv-DR/pub?output=csv';

  function parseCSV(text) {
    var p = '', c = '', r = [];
    var q = false;
    var row = [''];
    for (var i = 0; i < text.length; i++) {
      c = text[i];
      var next = text[i+1];
      if (c === '"') {
        if (q && next === '"') { row[row.length - 1] += '"'; i++; }
        else { q = !q; }
      } else if (c === ',' && !q) {
        row.push('');
      } else if ((c === '\r' || c === '\n') && !q) {
        if (c === '\r' && next === '\n') { i++; }
        r.push(row);
        row = [''];
      } else {
        row[row.length - 1] += c;
      }
    }
    if (row.length > 1 || row[0] !== '') r.push(row);
    return r;
  }

  function norm(str) {
    return (str || '').normalize("NFD").replace(/[\u0300-\u036f]/g, "").trim().toLowerCase();
  }

  function trobarIndex(headers, possibles) {
    return headers.findIndex(function(h) { return possibles.includes(norm(h)); });
  }

  function generarBotons(ttl, amz) {
    if (!ttl && !amz) return '';
    var h = '<div class="anem-botons-box">';
    if (ttl) h += '<a class="anem-boto-ext anem-boto-ttl" href="' + ttl + '" target="_blank" rel="noopener">Todostuslibros</a>';
    if (amz) h += '<a class="anem-boto-ext anem-boto-amz" href="' + amz + '" target="_blank" rel="noopener">Amazon</a>';
    h += '</div>';
    return h;
  }

  async function carregarDades() {
    var secNovetats = document.getElementById('seccio-novetats');
    var secDestacats = document.getElementById('seccio-destacats');
    var secGeneral = document.getElementById('seccio-general');

    try {
      var res = await fetch(CSV_URL);
      var text = await res.text();
      var rows = parseCSV(text);

      if (rows.length < 2) return;

      var headers = rows[0];

      var idxTitol = trobarIndex(headers, ['titol', 'titulo', 'title']);
      var idxAutor = trobarIndex(headers, ['autor', 'author']);
      var idxPreu = trobarIndex(headers, ['pvp', 'preu', 'precio', 'price']);
      var idxInici = trobarIndex(headers, ['inici web', 'inici', 'inicio web', 'inicio', 'estat']);
      var idxImg = trobarIndex(headers, ['coberta', 'url coberta', 'portada', 'url portada', 'imatge', 'imagen']);
      var idxLink = trobarIndex(headers, ['url llibre', 'url fitxa', 'url', 'enllac', 'link']);
      var idxTTL = trobarIndex(headers, ['todostuslibros', 'todos tus libros', 'ttl']);
      var idxAmz = trobarIndex(headers, ['amazon', 'amz']);

      var hNovetats = '', hDestacats = '', hGeneral = '';

      for (var i = 1; i < rows.length; i++) {
        var row = rows[i];
        var titol = idxTitol !== -1 && row[idxTitol] ? row[idxTitol].trim() : '';
        var estat = idxInici !== -1 && row[idxInici] ? row[idxInici].trim() : '';

        if (!titol) continue;

        var autor = idxAutor !== -1 && row[idxAutor] ? row[idxAutor].trim() : '';
        var preuRaw = idxPreu !== -1 && row[idxPreu] ? row[idxPreu].trim() : '';
        var img = idxImg !== -1 && row[idxImg] ? row[idxImg].trim() : '';
        var link = idxLink !== -1 && row[idxLink] ? row[idxLink].trim() : '#';
        var urlTTL = idxTTL !== -1 && row[idxTTL] ? row[idxTTL].trim() : '';
        var urlAmz = idxAmz !== -1 && row[idxAmz] ? row[idxAmz].trim() : '';

        var preu = preuRaw && !preuRaw.includes('€') ? preuRaw + ' €' : preuRaw;
        var botons = generarBotons(urlTTL, urlAmz);
        var estatNorm = norm(estat);

        if (estatNorm.includes('novetat')) {
          hNovetats += '<div class="anem-card-gran">' +
            '<div class="anem-foto-box">' +
              '<span class="anem-etiqueta anem-etiqueta-novetat">NOVETAT</span>' +
              '<a href="' + link + '"><img src="' + img + '" alt="' + titol + '"></a>' +
            '</div>' +
            '<a class="anem-titol-llibre" href="' + link + '"><b>' + titol.toUpperCase() + '</b></a>' +
            '<div class="anem-autor-llibre">' + autor + '</div>' +
            '<div class="anem-preu-llibre">' + preu + '</div>' +
            botons +
          '</div>';
        } else if (estatNorm.includes('destacat')) {
          hDestacats += '<div class="anem-card-gran">' +
            '<div class="anem-foto-box">' +
              '<span class="anem-etiqueta anem-etiqueta-destacat">DESTACAT</span>' +
              '<a href="' + link + '"><img src="' + img + '" alt="' + titol + '"></a>' +
            '</div>' +
            '<a class="anem-titol-llibre" href="' + link + '"><b>' + titol.toUpperCase() + '</b></a>' +
            '<div class="anem-autor-llibre">' + autor + '</div>' +
            '<div class="anem-preu-llibre">' + preu + '</div>' +
            botons +
          '</div>';
        } else if (estatNorm.includes('general') || (estatNorm !== '' && !estatNorm.includes('no'))) {
          hGeneral += '<div class="anem-card-petit">' +
            '<div>' +
              '<a href="' + link + '"><img src="' + img + '" alt="' + titol + '"></a>' +
              '<a class="anem-titol-llibre" href="' + link + '">' + titol.toUpperCase() + '</a>' +
              '<div class="anem-autor-llibre">' + autor + '</div>' +
            '</div>' +
            '<div>' +
              '<div class="anem-preu-llibre">' + preu + '</div>' +
              botons +
            '</div>' +
          '</div>';
        }
      }

      if (secNovetats) secNovetats.innerHTML = hNovetats;
      if (secDestacats) secDestacats.innerHTML = hNovetats ? hDestacats : hDestacats; // Fixed assignment safety
      if (secGeneral) secGeneral.innerHTML = hGeneral;

      // Ensure proper assignment for destacats specifically
      if (secDestacats) secDestacats.innerHTML = hDestacats;

    } catch (e) {
      console.error(e);
    }
  }

  carregarDades();
})();
</script>
