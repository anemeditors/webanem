<div id="seccio-novetats" style="display: flex; flex-wrap: wrap; justify-content: space-between; margin-top: 40px;"></div>
<div id="seccio-destacats" style="display: flex; flex-wrap: wrap; justify-content: space-between; margin-top: 40px;"></div>
<div id="seccio-general" style="display: flex; flex-wrap: wrap; justify-content: flex-start; margin-top: 40px;"></div>

<script>
(function() {
  var CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQESjqxo632pyAya7JVHONT0tCGm6XSLnHE1ft4dwY7uIRCUKSiXac8tOj1hYVEkmW-1E7KkPgYv-DR/pub?output=csv';

  function parseCSV(text) {
    var p = '', c = '', r = [];
    var q = false;
    var row = [''];
    for (var i = 0; i < text.length; i++) {
      c = text[i];
      var next = text[i+1];
      if (c === '"') {
        if (q && next === '"') { row[row.length - 1] += '"'; i++; }
        else { q = !q; }
      } else if (c === ',' && !q) {
        row.push('');
      } else if ((c === '\r' || c === '\n') && !q) {
        if (c === '\r' && next === '\n') { i++; }
        r.push(row);
        row = [''];
      } else {
        row[row.length - 1] += c;
      }
    }
    if (row.length > 1 || row[0] !== '') r.push(row);
    return r;
  }

  function norm(str) {
    return (str || '').normalize("NFD").replace(/[\u0300-\u036f]/g, "").trim().toLowerCase();
  }

  function trobarIndex(headers, possibles) {
    return headers.findIndex(function(h) { return possibles.includes(norm(h)); });
  }

  function generarBotons(ttl, amz) {
    if (!ttl && !amz) return '';
    var h = '<div style="display: flex; justify-content: center; gap: 8px; flex-wrap: wrap; margin-top: 8px;">';
    if (ttl) h += '<a style="display: inline-block; padding: 5px 10px; font-size: 0.75em; font-weight: bold; text-decoration: none; border-radius: 3px; background-color: #2b2b2b; color: #ffffff;" href="' + ttl + '" target="_blank" rel="noopener">Todostuslibros</a>';
    if (amz) h += '<a style="display: inline-block; padding: 5px 10px; font-size: 0.75em; font-weight: bold; text-decoration: none; border-radius: 3px; background-color: #e47911; color: #ffffff;" href="' + amz + '" target="_blank" rel="noopener">Amazon</a>';
    h += '</div>';
    return h;
  }

  async function carregarDades() {
    var secNovetats = document.getElementById('seccio-novetats');
    var secDestacats = document.getElementById('seccio-destacats');
    var secGeneral = document.getElementById('seccio-general');

    try {
      var res = await fetch(CSV_URL);
      var text = await res.text();
      var rows = parseCSV(text);

      if (rows.length < 2) return;

      var headers = rows[0];

      var idxTitol = trobarIndex(headers, ['titol', 'titulo', 'title']);
      var idxAutor = trobarIndex(headers, ['autor', 'author']);
      var idxPreu = trobarIndex(headers, ['pvp', 'preu', 'precio', 'price']);
      var idxInici = trobarIndex(headers, ['inici web', 'inici', 'inicio web', 'inicio', 'estat']);
      var idxImg = trobarIndex(headers, ['coberta', 'url coberta', 'portada', 'url portada', 'imatge', 'imagen']);
      var idxLink = trobarIndex(headers, ['url llibre', 'url fitxa', 'url', 'enllac', 'link']);
      var idxTTL = trobarIndex(headers, ['todostuslibros', 'todos tus libros', 'ttl']);
      var idxAmz = trobarIndex(headers, ['amazon', 'amz']);

      var hNovetats = '', hDestacats = '', hGeneral = '';

      for (var i = 1; i < rows.length; i++) {
        var row = rows[i];
        var titol = idxTitol !== -1 && row[idxTitol] ? row[idxTitol].trim() : '';
        var estat = idxInici !== -1 && row[idxInici] ? row[idxInici].trim() : '';

        if (!titol) continue;

        var autor = idxAutor !== -1 && row[idxAutor] ? row[idxAutor].trim() : '';
        var preuRaw = idxPreu !== -1 && row[idxPreu] ? row[idxPreu].trim() : '';
        var img = idxImg !== -1 && row[idxImg] ? row[idxImg].trim() : '';
        var link = idxLink !== -1 && row[idxLink] ? row[idxLink].trim() : '#';
        var urlTTL = idxTTL !== -1 && row[idxTTL] ? row[idxTTL].trim() : '';
        var urlAmz = idxAmz !== -1 && row[idxAmz] ? row[idxAmz].trim() : '';

        var preu = preuRaw && !preuRaw.includes('€') ? preuRaw + ' €' : preuRaw;
        var botons = generarBotons(urlTTL, urlAmz);
        var estatNorm = norm(estat);

        if (estatNorm.includes('novetat')) {
          hNovetats += '<div style="width: 47%; text-align: center; box-sizing: border-box; margin-bottom: 70px; padding-left: 15px;">' +
            '<div style="position: relative; display: inline-flex; margin-bottom: 20px; width: auto;">' +
              '<span style="position: absolute; top: 0; right: 100%; margin-right: 8px; color: white; font-size: 0.75em; padding: 4px 8px; font-weight: bold; border-radius: 3px; background-color: crimson; text-transform: uppercase; white-space: nowrap; z-index: 2;">NOVETAT</span>' +
              '<a href="' + link + '"><img src="' + img + '" alt="' + titol + '" style="width: 100%; height: auto; max-width: 320px; display: block; margin: 0 auto; filter: drop-shadow(0px 8px 12px rgba(0,0,0,0.25)); mix-blend-mode: multiply;"></a>' +
            '</div>' +
            '<a style="display: block; font-weight: bold; color: #c00; text-decoration: none; margin: 0 0 4px 0; font-size: 1.2em;" href="' + link + '"><b>' + titol.toUpperCase() + '</b></a>' +
            '<div style="font-size: 1em; color: #555; margin-bottom: 4px;">' + autor + '</div>' +
            '<div style="font-size: 1.1em; font-weight: bold; color: #333; margin-bottom: 12px;">' + preu + '</div>' +
            botons +
          '</div>';
        } else if (estatNorm.includes('destacat')) {
          hDestacats += '<div style="width: 47%; text-align: center; box-sizing: border-box; margin-bottom: 70px; padding-left: 15px;">' +
            '<div style="position: relative; display: inline-flex; margin-bottom: 20px; width: auto;">' +
              '<span style="position: absolute; top: 0; right: 100%; margin-right: 8px; color: white; font-size: 0.75em; padding: 4px 8px; font-weight: bold; border-radius: 3px; background-color: #2e7d32; text-transform: uppercase; white-space: nowrap; z-index: 2;">DESTACAT</span>' +
              '<a href="' + link + '"><img src="' + img + '" alt="' + titol + '" style="width: 100%; height: auto; max-width: 320px; display: block; margin: 0 auto; filter: drop-shadow(0px 8px 12px rgba(0,0,0,0.25)); mix-blend-mode: multiply;"></a>' +
            '</div>' +
            '<a style="display: block; font-weight: bold; color: #c00; text-decoration: none; margin: 0 0 4px 0; font-size: 1.2em;" href="' + link + '"><b>' + titol.toUpperCase() + '</b></a>' +
            '<div style="font-size: 1em; color: #555; margin-bottom: 4px;">' + autor + '</div>' +
            '<div style="font-size: 1.1em; font-weight: bold; color: #333; margin-bottom: 12px;">' + preu + '</div>' +
            botons +
          '</div>';
        } else if (estatNorm.includes('general') || (estatNorm !== '' && !estatNorm.includes('no'))) {
          hGeneral += '<div style="width: 23.5%; text-align: center; margin-bottom: 50px; box-sizing: border-box;">' +
            '<a style="display: block; margin-bottom: 15px; text-decoration: none;" href="' + link + '"><img src="' + img + '" alt="' + titol + '" style="width: auto; height: auto; max-width: 130px; max-height: 200px; display: block; margin: 0 auto; filter: drop-shadow(0px 4px 6px rgba(0,0,0,0.22)); mix-blend-mode: multiply;"></a>' +
            '<a style="display: block; font-weight: bold; color: red; text-decoration: none; margin: 0 0 3px 0;" href="' + link + '">' + titol.toUpperCase() + '</a>' +
            '<div style="font-size: 0.9em; color: #555; margin-bottom: 3px;">' + autor + '</div>' +
            '<div style="font-size: 0.95em; font-weight: bold; color: #333; margin-bottom: 10px;">' + preu + '</div>' +
            botons +
          '</div>';
        }
      }

      if (secNovetats) secNovetats.innerHTML = hNovetats;
      if (secDestacats) secDestacats.innerHTML = hDestacats;
      if (secGeneral) secGeneral.innerHTML = hGeneral;

    } catch (e) {
      console.error(e);
    }
  }

  carregarDades();
})();
</script>
